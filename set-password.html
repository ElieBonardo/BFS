
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Définir mon mot de passe - BFS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 30px 15px;
    }
    .box {
      max-width: 420px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 12px #ddd;
    }
    h1 { text-align: center; font-size: 23px; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 14px;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: none;
      background: #111;
      color: white;
      cursor: pointer;
    }
    #message { margin-top: 15px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Bonardo Fashion Store BFS</h1>
    <p>Définis ton mot de passe pour accéder à l’administration.</p>

    <form id="passwordForm">
      <input
        id="password"
        type="password"
        placeholder="Nouveau mot de passe"
        minlength="8"
        required
      >
      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirmer le mot de passe"
        minlength="8"
        required
      >
      <button type="submit">Enregistrer mon mot de passe</button>
    </form>

    <p id="message"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      "https://eulbdrwxyhdvosbmxnwy.supabase.co",
      "sb_publishable_LfwW5XWa2C_3WPArJvEsbQ_Klth7gNl"
    );

    const message = document.getElementById("message");

    document.getElementById("passwordForm")
      .addEventListener("submit", async function(event) {
        event.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (password.length < 8) {
          message.textContent = "Le mot de passe doit contenir au moins 8 caractères.";
          return;
        }

        if (password !== confirmPassword) {
          message.textContent = "Les deux mots de passe ne correspondent pas.";
          return;
        }

        message.textContent = "Enregistrement en cours...";

        const { data: sessionData, error: sessionError } =
          await supabaseClient.auth.getSession();

        if (sessionError || !sessionData.session) {
          message.textContent =
            "Lien invalide ou expiré. Demande un nouveau lien de récupération.";
          return;
        }

        const { error } = await supabaseClient.auth.updateUser({
          password: password
        });

        if (error) {
          message.textContent = "Erreur : " + error.message;
          return;
        }

        message.textContent =
          "Mot de passe enregistré ! Tu peux maintenant ouvrir l’administration.";

        document.getElementById("passwordForm").reset();
      });
  </script>
</body>
</html>
