<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Bonardo Fashion Store BFS : élégance, qualité et propreté. Découvrez nos produits et commandez sur WhatsApp.">
  <title>Bonardo Fashion Store BFS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --black: #080808;
      --black-soft: #151515;
      --white: #ffffff;
      --silver: #c7c7c7;
      --gray: #686868;
      --page: #f5f5f5;
      --green: #25D366;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--page);
      color: var(--black);
    }

    .site-header {
      background:
        radial-gradient(ellipse at top, #303030, transparent 65%),
        linear-gradient(145deg, #050505, #181818, #050505);
      color: var(--white);
      padding: 28px 15px;
      text-align: center;
      border-bottom: 2px solid var(--silver);
    }

    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .logo {
      width: 220px;
      height: 140px;
      max-width: 100%;
      object-fit: contain;
    }

    .site-header h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 32px);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .site-header p {
      color: var(--silver);
      letter-spacing: 1.5px;
      margin-bottom: 0;
      font-size: 13px;
    }

    .container {
      max-width: 1240px;
      margin: auto;
      padding: 25px 20px;
    }

    .section-heading {
      margin: 30px 0 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid #d5d5d5;
    }

    .section-kicker {
      margin: 0 0 5px;
      color: var(--gray);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .section-title {
      margin: 0;
      font-size: clamp(23px, 3vw, 29px);
    }

 .products {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 24px;
  margin-top: 24px;
}

    .product,
    .cart {
      background: var(--white);
      border: 1px solid #e3e3e3;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.05);
    }

    .product {
      min-width: 0;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.10);
    }

    .product-image-wrap {
      height: 265px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #ffffff, #f0f0f0);
      border-bottom: 1px solid #eeeeee;
    }

    .product img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .image-placeholder {
      width: 100%;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 15px;
      color: #777777;
      background: #eeeeee;
      font-size: 13px;
    }

    .product-info {
      padding: 16px;
    }

    .product h2 {
      margin: 0 0 9px;
      font-size: 17px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .description {
      color: var(--gray);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .price {
      margin: 14px 0 8px;
      font-size: 22px;
      font-weight: 800;
    }

    .category {
      color: #777777;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 7px;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    button:focus-visible {
      outline: 3px solid var(--silver);
      outline-offset: 3px;
    }

    .add-button {
      width: 100%;
      background: var(--black);
      color: var(--white);
      border: 1px solid #777777;
    }

    .add-button:hover {
      background: #333333;
    }

    .cart {
      padding: 22px;
      margin-bottom: 30px;
      border-top: 3px solid var(--black);
    }

    .cart h2 {
      margin-top: 0;
      font-size: 22px;
    }

    .cart-item {
      padding: 14px 0;
      border-bottom: 1px solid #e5e5e5;
    }

    .cart-item-name {
      font-weight: bold;
      margin-bottom: 7px;
      overflow-wrap: anywhere;
    }

    .cart-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .quantity-button {
      min-width: 38px;
      background: #eeeeee;
    }

    .remove-button {
      background: #f1f1f1;
      color: #333333;
      border: 1px solid #dddddd;
    }

    .cart-total {
      margin-top: 18px;
      font-size: 23px;
      font-weight: 800;
    }

    .checkout {
      width: 100%;
      display: block;
      margin-top: 16px;
      padding: 14px;
      background: var(--green);
      color: #ffffff;
      font-size: 15px;
    }

    .empty-cart,
    .loading {
      padding: 18px 0;
      color: var(--gray);
    }

    .loading {
      text-align: center;
      grid-column: 1 / -1;
    }

    .site-footer {
      margin-top: 30px;
      padding: 22px 12px;
      background: var(--black);
      color: #dddddd;
      border-top: 2px solid var(--silver);
      text-align: center;
      font-size: 13px;
    }

    .footer-tagline {
      display: block;
      margin-top: 6px;
      color: var(--silver);
      letter-spacing: 1px;
    }

    @media (max-width: 900px) {
      .products {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .product-image-wrap {
        height: 235px;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 18px 12px;
      }

      .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .product-image-wrap {
        height: 180px;
        padding: 7px;
      }

      .product-info {
        padding: 11px;
      }

      .product h2 {
        font-size: 15px;
      }

      .description {
        font-size: 12px;
      }

      .price {
        font-size: 19px;
      }

      .add-button {
        padding: 11px 5px;
        font-size: 12px;
      }

      .cart {
        padding: 16px;
      }

      .site-header {
        padding: 19px 10px;
      }

      .logo {
        width: 190px;
        height: 115px;
      }
    }

    @media (max-width: 350px) {
      .products {
        grid-template-columns: 1fr;
      }

      .product-image-wrap {
        height: 230px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }

.product-tools {
  display: flex;

  width: 100%;

}

.product-tools input,

.cart-toggle {

#cart-arrow {

</head>

</div>

  <script>
    const SUPABASE_URL =
      "https://eulbdrwxyhdvosbmxnwy.supabase.co";

    // Remplacez cette valeur par votre clé publique Supabase actuelle.
    // N'utilisez jamais une clé service_role ici.
    const SUPABASE_KEY = "sb_publishable_LfwW5XWa2C_3WPArJvEsbQ_Klth7gNl";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const WHATSAPP_NUMBER = "243900820742";

    const cart = new Map();

function saveCart() {
  const savedCart = Array.from(cart.entries()).map(([key, item]) => ({
    key: key,
    productId: item.product.id,
    quantity: item.quantity
  }));

  localStorage.setItem("bfs_cart", JSON.stringify(savedCart));
}

function restoreCart() {
  const savedCart = JSON.parse(
    localStorage.getItem("bfs_cart") || "[]"
  );

  cart.clear();

  savedCart.forEach(item => {
    const product = window.bfsProducts.find(
      product => String(product.id) === String(item.productId)
    );

    if (product && Number(item.quantity) > 0) {
      cart.set(String(item.key), {
        product: product,
        quantity: Number(item.quantity)
      });
    }
  });
}
    window.bfsProducts = [];

    const productsContainer =
  document.getElementById("products");

const cartItemsContainer =
  document.getElementById("cart-items");

const productSearch =
  document.getElementById("product-search");

const categoryFilter =
  document.getElementById("category-filter");
  
  
  const cartToggle = document.getElementById("cart-toggle");
const cartContent = document.getElementById("cart-content");
const cartArrow = document.getElementById("cart-arrow");

cartToggle.addEventListener("click", () => {
  const isOpen = cartToggle.getAttribute("aria-expanded") === "true";

  cartToggle.setAttribute("aria-expanded", String(!isOpen));
  cartContent.hidden = isOpen;
  cartArrow.textContent = isOpen ? "+" : "−";
});

function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function productKey(product) {
      return String(
        product.id ??
        product.Name ??
        product.name ??
        product.nom ??
        product.title
      );
    }

    function productName(product) {
      return String(
        product.Name ??
        product.name ??
        product.nom ??
        product.title ??
        "Produit"
      );
    }

    function productPrice(product) {
      const rawPrice =
        product.Price ??
        product.price ??
        product.prix;

      if (
        rawPrice === null ||
        rawPrice === undefined ||
        rawPrice === ""
      ) {
        return 0;
      }

      const normalized =
        typeof rawPrice === "string"
          ? rawPrice.trim().replace(/\s/g, "").replace(",", ".")
          : rawPrice;

      const price = Number(normalized);

      return Number.isFinite(price) && price >= 0
        ? price
        : 0;
    }

    function formatPrice(value) {
      return Number(value).toLocaleString("fr-FR", {
        maximumFractionDigits: 2
      });
    }

    // Le nom exact de la colonne des photos est image_url.
    function productImageURL(product) {
      return String(product.image_url ?? "").trim();
    }

    function productDescription(product) {
      return String(
        product.Description ??
        product.description ??
        ""
      );
    }

    function productCategory(product) {
      return String(
        product.category ??
        product.Category ??
        ""
      );
    }






    function addToCart(key) {
      const product = window.bfsProducts.find(
        item => productKey(item) === key
      );

      if (!product) {
        alert("Ce produit est introuvable. Actualisez la page.");
        return;
      }

      const existing = cart.get(key);

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.set(key, {
          product: product,
          quantity: 1
        });
      }

      saveCart();
renderCart();
    }

    function changeQuantity(key, amount) {
      const item = cart.get(key);

      if (!item) return;

      item.quantity += amount;

      if (item.quantity <= 0) {
        cart.delete(key);
      }

      renderCart();
    }

    function removeFromCart(key) {
      cart.delete(key);
      renderCart();
    }

    function renderCart() {
      let count = 0;
      let total = 0;

      cart.forEach(item => {
        count += item.quantity;
        total += productPrice(item.product) * item.quantity;
      });

      document.getElementById("cart-count").textContent = count;

      document.getElementById("cart-total").textContent =
        formatPrice(total);

      if (cart.size === 0) {
        cartItemsContainer.innerHTML =
          '<p class="empty-cart">Votre panier est vide.</p>';
        return;
      }

      cartItemsContainer.innerHTML =
        Array.from(cart.entries()).map(([key, item]) => {
          const product = item.product;
          const name = productName(product);
          const price = productPrice(product);
          const subtotal = price * item.quantity;

          return `
            <div class="cart-item">
              <div class="cart-item-name">
                ${escapeHTML(name)}
              </div>

              <div>
                ${formatPrice(price)}$ × ${item.quantity}
                = <strong>${formatPrice(subtotal)}$</strong>
              </div>

              <div class="cart-controls">
                <button
                  class="quantity-button"
                  data-action="minus"
                  data-key="${escapeHTML(key)}"
                  type="button"
                  aria-label="Diminuer la quantité">−</button>

                <span>Quantité : ${item.quantity}</span>

                <button
                  class="quantity-button"
                  data-action="plus"
                  data-key="${escapeHTML(key)}"
                  type="button"
                  aria-label="Augmenter la quantité">+</button>

                <button
                  class="remove-button"
                  data-action="remove"
                  data-key="${escapeHTML(key)}"
                  type="button">Retirer</button>
              </div>
            </div>
          `;
        }).join("");
    }

    cartItemsContainer.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");

      if (!button) return;

      const key = button.dataset.key;
      const action = button.dataset.action;

      if (action === "plus") {
        changeQuantity(key, 1);
      } else if (action === "minus") {
        changeQuantity(key, -1);
      } else if (action === "remove") {
        removeFromCart(key);
      }
    });

    document.getElementById("checkout").addEventListener(
      "click",
      async () => {
        if (cart.size === 0) {
          alert("Votre panier est vide. Ajoutez d'abord un produit.");
          return;
        }

        let total = 0;

        const lines = [
          "Bonjour BFS, je voudrais passer cette commande :",
          ""
        ];

        const orderItems = [];

        cart.forEach(item => {
          const product = item.product;
          const name = productName(product);
          const price = productPrice(product);
          const subtotal = price * item.quantity;

          total += subtotal;

          orderItems.push({
            product_id: product.id ?? null,
            name: name,
            price: price,
            quantity: item.quantity,
            subtotal: subtotal
          });

          lines.push(
            "- " + name +
            " | Quantité : " + item.quantity +
            " | Prix unitaire : " + formatPrice(price) + "$" +
            " | Sous-total : " + formatPrice(subtotal) + "$"
          );
        });

        lines.push(
          "",
          "TOTAL : " + formatPrice(total) + "$",
          "",
          "Merci de me confirmer la disponibilité."
        );

        const whatsappURL =
          "https://wa.me/" + WHATSAPP_NUMBER +
          "?text=" + encodeURIComponent(lines.join("\n"));

        // Ouvrir WhatsApp dès le clic du client.
        const whatsappWindow = window.open(
          whatsappURL,
          "_blank"
        );

        if (!whatsappWindow) {
          alert(
            "WhatsApp n'a pas pu s'ouvrir. Vérifiez les réglages du navigateur."
          );
        }

        // Enregistrer la commande dans Supabase.
        try {
  const { data, error } = await supabaseClient
    .rpc("create_order_with_stock", {
      p_items: orderItems,
      p_total: total
    });

  if (error) {
    console.error(
      "Erreur lors de l'enregistrement de la commande :",
      error
    );

    alert(
      "La commande n'a pas été enregistrée. Vérifiez le stock disponible. " +
      error.message
    );
    return;
  }

  console.log(
  "Commande enregistrée et stock mis à jour :",
  data
);

alert("Commande enregistrée et stock mis à jour avec succès.");

cart.clear();
localStorage.removeItem("bfs_cart");
renderCart();
} catch (error) {
  console.error("Erreur d'enregistrement :", error);

  alert(
    "Impossible d'enregistrer la commande : " + error.message
  );
}

          
      }
    );

    function renderProducts() {
  const products = window.bfsProducts || [];

  const searchText = (productSearch.value || "")
    .trim()
    .toLowerCase();

  const selectedCategory = categoryFilter.value;

  const filteredProducts = products.filter(product => {
    const name = productName(product);
    const description = productDescription(product);
    const category = productCategory(product);

    const searchableText =
      `${name} ${description} ${category}`.toLowerCase();

    const matchesSearch = searchableText.includes(searchText);

    const matchesCategory =
  !selectedCategory ||
  category.trim().toLowerCase() === selectedCategory.trim().toLowerCase();

    return matchesSearch && matchesCategory;
  });

  productsContainer.innerHTML = "";

  if (filteredProducts.length === 0) {
    productsContainer.innerHTML =
      '<div class="loading">Aucun produit trouvé.</div>';
    return;
  }

  filteredProducts.forEach(product => {
    const key = productKey(product);
    const name = productName(product);
    const imageURL = productImageURL(product);
    const price = productPrice(product);

    const card = document.createElement("article");
    card.className = "product";

    const imageWrap = document.createElement("div");
    imageWrap.className = "product-image-wrap";

    if (imageURL) {
      const image = document.createElement("img");

      image.src = imageURL;
      image.alt = name;
      image.loading = "lazy";
      image.decoding = "async";

      image.addEventListener("error", () => {
        imageWrap.innerHTML =
          '<div class="image-placeholder">Photo indisponible</div>';

        console.error("Erreur de chargement de la photo :", imageURL);
      }, { once: true });

      imageWrap.appendChild(image);
    } else {
      imageWrap.innerHTML =
        '<div class="image-placeholder">Aucune photo renseignée</div>';
    }

    const info = document.createElement("div");
    info.className = "product-info";

    info.innerHTML = `
      <h2>${escapeHTML(name)}</h2>

      <div class="description">
        ${escapeHTML(productDescription(product))}
      </div>

      <div class="price">
        ${formatPrice(price)}$
      </div>

      <div class="category">
        ${escapeHTML(productCategory(product))}
      </div>

      <button class="add-button" type="button">
        Ajouter au panier
      </button>
    `;

    info.querySelector(".add-button").addEventListener(
      "click",
      () => addToCart(key)
    );

    card.appendChild(imageWrap);
    card.appendChild(info);

    productsContainer.appendChild(card);
  });
}

    .trim()
    .toLowerCase();

  const selectedCategory = categoryFilter.value;

const inStock = Number.isFinite(stock) && stock > 0;

    const card = document.createElement("article");

    const imageWrap = document.createElement("div");

    if (imageURL) {

        console.error("Erreur de chargement de la photo :", imageURL);

    } else {
      imageWrap.innerHTML =
        '<div class="image-placeholder">Aucune photo renseignée</div>';
    }

    const info = document.createElement("div");
    info.className = "product-info";

    info.innerHTML = `
      <h2>${escapeHTML(name)}</h2>

      <div class="description">
        ${escapeHTML(productDescription(product))}
      </div>

     <div class="price">
  ${formatPrice(price)}$
</div>
<div class="category">
  ${escapeHTML(productCategory(product))}
</div>
<div class="stock">
  ${
    Number(product.stock) > 0
      ? `En stock : ${Number(product.stock)}`
      : "Rupture de stock"
  }
</div>

    <button
  class="add-button"
  type="button"
  ${inStock ? "" : "disabled"}
>
  ${inStock ? "Ajouter au panier" : "Indisponible"}
</button>
`;

    if (inStock) {
      info.querySelector(".add-button").addEventListener(
        "click",
        () => addToCart(key)
      );
    }

    card.appendChild(imageWrap);
    card.appendChild(info);

    productsContainer.appendChild(card);
  });
}

async function loadProducts() {
  productsContainer.innerHTML =
    '<div class="loading">Chargement des produits...</div>';

  try {
    const { data, error } = await supabaseClient
      .from("products")
      .select("*")
      .order("id", { ascending: false });

    if (error) {
      console.error("Erreur Supabase :", error);

      productsContainer.textContent =
        "Impossible de charger les produits. Vérifiez la connexion Supabase.";

      return;
    }

    window.bfsProducts = data || [];

    categoryFilter.innerHTML =
      '<option value="">Toutes les catégories</option>';

    const categories = [
      ...new Set(
        window.bfsProducts
          .map(product => productCategory(product).trim())
          .filter(Boolean)
      )
    ].sort((a, b) => a.localeCompare(b));

    categories.forEach(category => {
      const option = document.createElement("option");
      option.value = category;
      option.textContent = category;
      categoryFilter.appendChild(option);
    });

    restoreCart();
renderProducts();
renderCart();

  } catch (error) {
    console.error("Erreur de chargement des produits :", error);

    productsContainer.textContent =
      "Une erreur est survenue lors du chargement des produits.";
  }
}

productSearch.addEventListener("input", renderProducts);
categoryFilter.addEventListener("change", renderProducts);

    renderCart();
    loadProducts();
  </script>
</body>
</html>
