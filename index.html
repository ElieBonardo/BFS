<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bonardo Fashion Store BFS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 8px 0 0;
      color: #ddd;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 15px;
    }

    .product h2 {
      font-size: 19px;
      margin: 0 0 8px;
    }

    .description {
      color: #666;
      font-size: 14px;
      min-height: 38px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 12px 0;
    }

    .category {
      color: #777;
      font-size: 13px;
    }

    .whatsapp {
      display: block;
      text-align: center;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 11px;
      border-radius: 8px;
      margin-top: 12px;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 40px;
    }

    .error {
      background: #fff;
      color: #b00020;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<header>
  <h1>Bonardo Fashion Store BFS</h1>
  <p>Élégance • Qualité • Propreté</p>
</header>

<div class="container">

  <h2>Nos produits</h2>

  <div id="products" class="products">
    <div class="loading">Chargement des produits...</div>
  </div>

</div>

<script>

const SUPABASE_URL = "https://eulbdrwxyhdvosbmxnwy.supabase.co";

/*
  IMPORTANT :
  Ici tu dois remettre TON publishable key Supabase.
  Ne mets surtout pas une clé sb_secret.
*/
const SUPABASE_KEY = "sb_publishable_LfwW5XWa2C_3WPArJvEsbQ_Klth7gNl";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loadProducts() {

  const container = document.getElementById("products");

  try {

    const { data, error } = await supabaseClient
      .from("products")
      .select("*")
      .order("id", { ascending: false });

    console.log("DATA :", data);
    console.log("ERROR :", error);

    if (error) {

      container.innerHTML = `
        <div class="error">
          <h3>Erreur Supabase</h3>
          <p><strong>Message :</strong> ${error.message || ""}</p>
          <p><strong>Code :</strong> ${error.code || ""}</p>
          <p><strong>Détails :</strong> ${error.details || ""}</p>
          <p><strong>Indice :</strong> ${error.hint || ""}</p>
        </div>
      `;

      return;
    }

    if (!data || data.length === 0) {

      container.innerHTML = `
        <p>Aucun produit disponible.</p>
      `;

      return;
    }

    container.innerHTML = "";

    data.forEach(product => {

      const card = document.createElement("div");

      card.className = "product";

      const image = product.image_url
        ? `<img src="${product.image_url.trim()}" alt="${product.Name || "Produit"}">`
        : "";

      const whatsappMessage = encodeURIComponent(
        `Bonjour BFS, je voudrais commander : ${product.Name || "Produit"} à ${product.Price || 0}$`
      );

      card.innerHTML = `
        ${image}

        <div class="product-info">

          <h2>${product.Name || ""}</h2>

          <div class="description">
            ${product.Description || ""}
          </div>

          <div class="price">
            ${product.Price ?? 0}$
          </div>

          <div class="category">
            ${product.category || ""}
          </div>

          <a
            class="whatsapp"
            href="https://wa.me/243900820722?text=${whatsappMessage}"
            target="_blank"
            rel="noopener">
            Commander sur WhatsApp
          </a>

        </div>
      `;

      container.appendChild(card);

    });

  } catch (e) {

    container.innerHTML = `
      <div class="error">
        <h3>Erreur JavaScript</h3>
        <p>${e.message || e}</p>
      </div>
    `;

  }
}

loadProducts();

</script>

</body>
</html>
