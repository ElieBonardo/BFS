 <!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bonardo Fashion Store BFS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

 <style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
  }

  .site-header {
    width: 100%;
    background: #111;
    color: white;
    padding: 20px 15px;
    text-align: center;
  }

  .logo-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 12px;
  }

.logo {
  width: 220px;
  height: 140px;
  object-fit: contain;
  display: block;
}

  .site-header h1 {
    margin: 0;
    font-size: 26px;
  }

  .site-header p {
    margin: 8px 0 0;
    color: #ddd;
    font-size: 15px;
  }

  .container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 20px;
  }

  .container > h2 {
    font-size: 26px;
    margin: 0 0 20px;
  }

  .products {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }

  .product {
    width: 100%;
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
  }

  .product img {
    width: 100%;
    height: 280px;
    object-fit: contain;
    object-position: center;
    background: #f5f5f5;
    display: block;
  }

  .product-info {
    padding: 15px;
  }

  .product h2 {
    font-size: 20px;
    margin: 0 0 10px;
  }

  .description {
    color: #666;
    font-size: 15px;
    min-height: 38px;
    line-height: 1.4;
  }

  .price {
    font-size: 22px;
    font-weight: bold;
    margin: 12px 0;
  }

  .category {
    color: #777;
    font-size: 14px;
  }

.product .whatsapp {
  display: block;
  width: 100%;
  box-sizing: border-box;
  text-align: center;
  background-color: #25D366 !important;
  color: #ffffff !important;
  text-decoration: none;
  padding: 14px;
  border-radius: 8px;
  margin-top: 14px;
  font-size: 17px;
  font-weight: bold;
}

  .loading {
    text-align: center;
    padding: 40px;
    font-size: 18px;
  }

  @media (max-width: 600px) {
    .container {
      padding: 15px;
    }
    
  .logo {

    width: 220px;

    height: 140px;

    object-fit: contain;
}

    .products {
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .product img {
      height: 300px;
    }

    .product h2 {
      font-size: 21px;
    }

    .description {
      font-size: 16px;
    }

    .price {
      font-size: 23px;
    }

    .category {
      font-size: 15px;
    }

    .whatsapp {
      font-size: 17px;
      padding: 14px;
    }
  }
</style>
</head>

<body>

<header class="site-header">
  <div class="logo-container">
  <img
  src="./2B9CD460-6536-4582-A364-76DF6EC42CB4.png"
  alt="Logo BonA"
  class="logo"
>
  </div>

  <h1>Bonardo Fashion Store BFS</h1>
  <p>Élégance • Qualité • Propreté</p>
</header>

<div class="container">

  <h2>Nos produits</h2>

  <div id="products" class="products">
    <div class="loading">Chargement des produits...</div>
  </div>

</div>

<script>

  const SUPABASE_URL = "https://eulbdrwxyhdvosbmxnwy.supabase.co";

  const SUPABASE_KEY = "sb_publishable_LfwW5XWa2C_3WPArJvEsbQ_Klth7gNl";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function loadProducts() {


    const { data, error } = await supabaseClient
  .from("products")
  .select("*")
  .order("id", { ascending: false });
  
  console.log("DONNÉES SUPABASE :", data);
    

    const container = document.getElementById("products");

    if (error) {
  container.innerHTML =
    `<p>Erreur Supabase : ${error.message}</p>`;
  console.error(error);
  return;
}

    if (!data || data.length === 0) {
      container.innerHTML =
        "<p>Aucun produit disponible.</p>";
      return;
    }

    container.innerHTML = "";

    data.forEach(product => {

      const card = document.createElement("div");
      card.className = "product";

      const image = product.image_url
  ? `<img src="${product.image_url}" alt="${product.Name}">`
  : "<p>IMAGE MANQUANTE</p>";

console.log("PRODUIT :", product);
console.log("PRIX :", product.Price);
console.log("TOUTES LES DONNÉES :", Object.keys(product));

const whatsappMessage =
  encodeURIComponent(
    `Bonjour BFS, je voudrais commander : ${product.Name} à ${product.Price}$`
  );

card.innerHTML = `
  ${image}

  <div class="product-info">

    <h2>${product.Name}</h2>

    <div class="description">
      ${product.Description || ""}
    </div>

    <div class="price">
      ${product.Price ?? "PRIX MANQUANT"}$
    </div>

          <div class="category">
            ${product.category || ""}
          </div>

          <a
            class="whatsapp"
            href="https://wa.me/243900820742?text=${whatsappMessage}"
            target="_blank">
            Commander sur WhatsApp
          </a>

        </div>
      `;

      container.appendChild(card);
    });
  }

  loadProducts();

</script>

</body>
</html>
