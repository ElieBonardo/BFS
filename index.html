
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonardo Fashion Store BFS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .site-header {
      background: #111;
      color: white;
      padding: 20px 15px;
      text-align: center;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .logo {
      width: 220px;
      height: 140px;
      object-fit: contain;
    }

    .site-header h1 { margin: 0; font-size: 26px; }
    .site-header p { color: #ddd; }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product, .cart {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .product img {
      width: 100%;
      height: 280px;
      object-fit: contain;
      background: #f5f5f5;
      display: block;
    }

    .product-info { padding: 15px; }
    .product h2 { font-size: 20px; margin: 0 0 10px; }
    .description { color: #666; line-height: 1.4; }
    .price { font-size: 22px; font-weight: bold; margin: 12px 0; }
    .category { color: #777; font-size: 14px; }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
    }

    .add-button, .checkout {
      display: block;
      width: 100%;
      margin-top: 12px;
      background: #25D366;
      color: white;
    }

    .cart { padding: 18px; margin-bottom: 28px; }
    .cart h2 { margin-top: 0; }

    .cart-item {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }

    .cart-item-name { font-weight: bold; }
    .cart-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .quantity-button {
      background: #eee;
      min-width: 38px;
    }

    .remove-button {
      background: #ffe5e5;
      color: #a00;
    }

    .cart-total {
      font-size: 22px;
      font-weight: bold;
      margin-top: 18px;
    }

    .empty-cart { color: #666; }
    .loading { padding: 30px; text-align: center; }

    @media (max-width: 600px) {
      .container { padding: 15px; }
      .products { grid-template-columns: 1fr; }
      .product img { height: 300px; }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="logo-container">
    <img
      src="./2B9CD460-6536-4582-A364-76DF6EC42CB4.png"
      alt="Logo Bonardo Fashion Store"
      class="logo"
    >
  </div>
  <h1>Bonardo Fashion Store BFS</h1>
  <p>Élégance • Qualité • Propreté</p>
</header>

<main class="container">

  <section class="cart">
    <h2>🛒 Mon panier (<span id="cart-count">0</span>)</h2>
    <div id="cart-items">
      <p class="empty-cart">Votre panier est vide.</p>
    </div>
    <div class="cart-total">
      Total : <span id="cart-total">0</span>$
    </div>
    <button id="checkout" class="checkout" type="button">
      Commander sur WhatsApp
    </button>
  </section>

  <h2>Nos produits</h2>
  <div id="products" class="products">
    <div class="loading">Chargement des produits...</div>
  </div>

</main>

<script>
  const SUPABASE_URL =
    "https://eulbdrwxyhdvosbmxnwy.supabase.co";

  // Garde ici ta vraie clé Supabase actuelle.
  // Ne remplace pas ta clé par le texte d'exemple.
  const SUPABASE_KEY = "sb_publishable_LfwW5XWa2C_3WPArJvEsbQ_Klth7gNl";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const WHATSAPP_NUMBER = "243900820742";
  const cart = new Map();

  const productsContainer = document.getElementById("products");
  const cartItemsContainer = document.getElementById("cart-items");

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function productKey(product) {
    return String(product.id ?? product.Name);
  }

  function productPrice(product) {
    const price = Number(product.Price);
    return Number.isFinite(price) && price >= 0 ? price : 0;
  }

  function formatPrice(value) {
    return Number(value).toLocaleString("fr-FR", {
      maximumFractionDigits: 2
    });
  }

  function addToCart(key) {
    const existing = cart.get(key);

    if (existing) {
      existing.quantity += 1;
    } else {
      const product = window.bfsProducts.find(
        item => productKey(item) === key
      );

      if (!product) return;

      cart.set(key, { product, quantity: 1 });
    }

    renderCart();
  }

  function changeQuantity(key, amount) {
    const item = cart.get(key);
    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {
      cart.delete(key);
    }

    renderCart();
  }

  function removeFromCart(key) {
    cart.delete(key);
    renderCart();
  }

  function renderCart() {
    let count = 0;
    let total = 0;

    cart.forEach(item => {
      count += item.quantity;
      total += productPrice(item.product) * item.quantity;
    });

    document.getElementById("cart-count").textContent = count;
    document.getElementById("cart-total").textContent =
      formatPrice(total);

    if (cart.size === 0) {
      cartItemsContainer.innerHTML =
        '<p class="empty-cart">Votre panier est vide.</p>';
      return;
    }

    cartItemsContainer.innerHTML = Array.from(cart.entries())
      .map(([key, item]) => {
        const product = item.product;
        const subtotal = productPrice(product) * item.quantity;

        return `
          <div class="cart-item">
            <div class="cart-item-name">
              ${escapeHTML(product.Name)}
            </div>
            <div>
              ${formatPrice(productPrice(product))}$ ×
              ${item.quantity} =
              <strong>${formatPrice(subtotal)}$</strong>
            </div>
            <div class="cart-controls">
              <button class="quantity-button"
                data-action="minus" data-key="${escapeHTML(key)}"
                aria-label="Diminuer la quantité">−</button>
              <span>Quantité : ${item.quantity}</span>
              <button class="quantity-button"
                data-action="plus" data-key="${escapeHTML(key)}"
                aria-label="Augmenter la quantité">+</button>
              <button class="remove-button"
                data-action="remove" data-key="${escapeHTML(key)}">
                Retirer
              </button>
            </div>
          </div>
        `;
      }).join("");
  }

  cartItemsContainer.addEventListener("click", event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;

    const key = button.dataset.key;

    if (button.dataset.action === "plus") {
      changeQuantity(key, 1);
    } else if (button.dataset.action === "minus") {
      changeQuantity(key, -1);
    } else if (button.dataset.action === "remove") {
      removeFromCart(key);
    }
  });

  
document.getElementById("checkout").addEventListener("click", async () => {
  if (cart.size === 0) {
    alert("Votre panier est vide. Ajoutez d'abord un produit.");
    return;
  }

  let total = 0;

  const lines = [
    "Bonjour BFS, je voudrais passer cette commande :",
    ""
  ];

  const orderItems = [];

  cart.forEach(item => {
    const product = item.product;
    const price = Number(productPrice(product));
    const subtotal = price * item.quantity;

    total += subtotal;

    orderItems.push({
      product_id: product.id ?? null,
      name: product.Name,
      price: price,
      quantity: item.quantity,
      subtotal: subtotal
    });

    lines.push(
      "- " + product.Name +
      " | Quantité : " + item.quantity +
      " | Prix unitaire : " + formatPrice(price) + "$" +
      " | Sous-total : " + formatPrice(subtotal) + "$"
    );
  });

  lines.push("");
  lines.push("TOTAL : " + formatPrice(total) + "$");
  lines.push("");
  lines.push("Merci de me confirmer la disponibilité.");

  const url = "https://wa.me/" + WHATSAPP_NUMBER +
    "?text=" + encodeURIComponent(lines.join("\n"));

  // Ouvrir une fenêtre pour WhatsApp pendant le clic du client.
  
const whatsappWindow = window.open(url, "_blank");

if (!whatsappWindow) {
  alert("Autorisez les fenêtres pop-up pour continuer la commande.");
}

try {
  const { error } = await supabaseClient
    .from("orders")
    .insert([
      {
        items: orderItems,
        total: total
      }
    ]);

  if (error) {
    console.error("Erreur Supabase :", error);
    alert(
      "WhatsApp est ouvert, mais la commande n'a pas pu être enregistrée. " +
      "Contactez BFS pour confirmer votre commande."
    );
    return;
  }

  console.log("Commande BFS enregistrée avec succès.");
} catch (error) {
  console.error("Erreur d'enregistrement :", error);
  alert(
    "WhatsApp est ouvert, mais l'enregistrement de la commande a échoué."
  );
}
});


    if (error) {
      console.error("Erreur Supabase :", error);
      whatsappWindow.close();
      alert(
        "La commande n'a pas pu être enregistrée. " +
        "Aucun message WhatsApp n'a été ouvert. " +
        "Vérifiez la connexion Supabase."
      );
      return;
    }

    whatsappWindow.location.href = url;

    alert("Commande enregistrée avec succès ! Continuez sur WhatsApp.");
  } catch (error) {
    console.error("Erreur :", error);
    whatsappWindow.close();
    alert("Erreur de connexion. La commande n'a pas été enregistrée.");
  }
});


  window.bfsProducts = [];

  async function loadProducts() {
    const { data, error } = await supabaseClient
      .from("products")
      .select("*")
      .order("id", { ascending: false });

    if (error) {
      productsContainer.textContent =
        "Impossible de charger les produits : " + error.message;
      console.error("Erreur Supabase :", error);
      return;
    }

    if (!data || data.length === 0) {
      productsContainer.textContent = "Aucun produit disponible.";
      return;
    }

    window.bfsProducts = data;
    productsContainer.innerHTML = "";

    data.forEach(product => {
      const key = productKey(product);
      const card = document.createElement("article");
      card.className = "product";

      const rawImage = String(product.image_url ?? "")
        .trim()
        .replace(/(%0A|%0D)+$/i, "");

      const imageHTML = rawImage
        ? `<img src="${escapeHTML(rawImage)}"
             alt="${escapeHTML(product.Name)}"
             loading="lazy">`
        : "<p class='product-info'>Photo indisponible</p>";

      card.innerHTML = `
        ${imageHTML}
        <div class="product-info">
          <h2>${escapeHTML(product.Name || "Produit")}</h2>
          <div class="description">
            ${escapeHTML(product.Description || "")}
          </div>
          <div class="price">
            ${product.Price !== null && product.Price !== undefined
              && product.Price !== ""
              ? escapeHTML(product.Price) + "$"
              : "Prix indisponible"}
          </div>
          <div class="category">
            ${escapeHTML(product.category || "")}
          </div>
          <button class="add-button" type="button">
            Ajouter au panier
          </button>
        </div>
      `;

      card.querySelector(".add-button").addEventListener("click", () => {
        addToCart(key);
      });

      productsContainer.appendChild(card);
    });
  }

  renderCart();
  loadProducts();
</script>

</body>
</html>
