<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BFS Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .admin {
      width: 100%;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    #loginSection,
    #dashboard {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .admin-product {
      padding: 15px;
      margin-top: 12px;
      background: #f5f5f5;
      border-radius: 10px;
    }

  </style>

</head>

<body>

<div class="admin">

  <!-- CONNEXION -->

  <div id="loginSection">

    <h1>🔐 BFS Admin</h1>

    <p>Connexion administrateur</p>

    <label for="email">
      E-mail
    </label>

    <input
      type="email"
      id="email"
      placeholder="Votre e-mail"
      autocomplete="email"
    >

    <label for="password">
      Mot de passe
    </label>

    <input
      type="password"
      id="password"
      placeholder="Votre mot de passe"
      autocomplete="current-password"
    >

    <button id="loginButton">
      Se connecter
    </button>

    <div id="message"></div>

  </div>


  <!-- TABLEAU DE BORD -->

  <div
    id="dashboard"
    style="display:none;"
  >

    <h1>🏪 BFS Admin</h1>

    <p style="text-align:center;">
      Gestion de Bonardo Fashion Store
    </p>

    <hr>

    <h2>Ajouter un produit</h2>

<form id="addProductForm">

  <label for="productName">Nom du produit</label>
  <input
    type="text"
    id="productName"
    required
  >

  <label for="productPrice">Prix en dollars</label>
  <input
    type="number"
    id="productPrice"
    min="0"
    step="0.01"
    required
  >

  <label for="productDescription">Description</label>
  <textarea
    id="productDescription"
    rows="3"
  ></textarea>

  <label for="productCategory">Catégorie</label>
  <input
    type="text"
    id="productCategory"
  >

  <label for="productImage">Photo du produit</label>
  <input
    type="file"
    id="productImage"
    accept="image/*"
    required
  >

  <button type="submit">
    Ajouter le produit
  </button>

  <p id="addProductMessage"></p>

</form>

<hr>

<h2>Gestion des produits</h2>

<div id="adminProducts">
  Chargement des produits...
</div>

    <button id="logoutButton">
      Se déconnecter
    </button>

  </div>

</div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://eulbdrwxyhdvosbmxnwy.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_LfwW5XWa2C_3WPArJvEsbQ_Klth7gNl";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     ELEMENTS
  ========================= */

  const loginButton =
    document.getElementById("loginButton");

  const logoutButton =
    document.getElementById("logoutButton");

  const message =
    document.getElementById("message");

  const loginSection =
    document.getElementById("loginSection");

  const dashboard =
    document.getElementById("dashboard");


  /* =========================
     CONNEXION
  ========================= */

  loginButton.addEventListener(
    "click",
    async () => {

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;


      if (!email || !password) {

        message.textContent =
          "Veuillez remplir les deux champs.";

        return;
      }


      message.textContent =
        "Connexion en cours...";


      const { data, error } =
        await supabaseClient.auth
          .signInWithPassword({
            email: email,
            password: password
          });


      if (error) {

        message.textContent =
          "Erreur : " + error.message;

        console.error(
          "ERREUR CONNEXION :",
          error
        );

        return;
      }


      console.log(
        "ADMIN CONNECTÉ :",
        data.user
      );


      loginSection.style.display =
        "none";

      dashboard.style.display =
        "block";

      message.textContent = "";


      await loadAdminProducts();

    }
  );


  /* =========================
     PRODUITS
  ========================= */

  
async function loadAdminProducts() {
  const container = document.getElementById("adminProducts");

  container.innerHTML = "<p>Chargement des produits...</p>";

  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    container.textContent = "Erreur : " + error.message;
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    container.innerHTML = "<p>Aucun produit disponible.</p>";
    return;
  }

  container.innerHTML = "";

  data.forEach(product => {
    const item = document.createElement("div");
    item.className = "admin-product";
    item.style.cssText =
      "padding:15px;margin-bottom:15px;background:#f5f5f5;border-radius:10px;";

    const title = document.createElement("h3");
    title.textContent = product.Name || "Sans nom";
    item.appendChild(title);

    if (product.image_url) {
      const img = document.createElement("img");
      img.src = product.image_url;
      img.alt = product.Name || "Produit";
      img.style.cssText =
        "width:100%;max-width:300px;height:220px;object-fit:contain;background:white;";
      item.appendChild(img);
    }

    const details = document.createElement("p");
    details.textContent =
      `Prix : ${product.Price ?? ""}$ | Catégorie : ${product.category || ""}`;
    item.appendChild(details);

    const description = document.createElement("p");
    description.textContent = product.Description || "";
    item.appendChild(description);

    const editButton = document.createElement("button");
    editButton.textContent = "Modifier";
    editButton.style.cssText =
      "background:#1769ff;color:white;padding:10px 16px;border:0;border-radius:7px;margin:5px;";

    editButton.addEventListener("click", () => {
      const newName = prompt("Nom du produit :", product.Name || "");
      if (newName === null) return;

      const newPriceText = prompt("Prix en dollars :", product.Price ?? "");
      if (newPriceText === null) return;

      const newPrice = Number(newPriceText);
      if (!newName.trim() || newPriceText.trim() === "" ||
          !Number.isFinite(newPrice) || newPrice < 0) {
        alert("Vérifie le nom et le prix.");
        return;
      }

      const newDescription = prompt(
        "Description :", product.Description || ""
      );
      if (newDescription === null) return;

      const newCategory = prompt(
        "Catégorie :", product.category || ""
      );
      if (newCategory === null) return;

      saveProductChanges(
        product.id,
        newName.trim(),
        newPrice,
        newDescription.trim(),
        newCategory.trim()
      );
    });

    item.appendChild(editButton);

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "Supprimer";
    deleteButton.style.cssText =
      "background:#c62828;color:white;padding:10px 16px;border:0;border-radius:7px;margin:5px;";

    deleteButton.addEventListener("click", async () => {
      if (!confirm(`Supprimer définitivement « ${product.Name} » ?`)) return;

      const { error } = await supabaseClient
        .from("products")
        .delete()
        .eq("id", product.id);

      if (error) {
        alert("Erreur de suppression : " + error.message);
        return;
      }

      alert("Produit supprimé.");
      await loadAdminProducts();
    });

    item.appendChild(deleteButton);
    container.appendChild(item);
  });
}


async function saveProductChanges(id, name, price, description, category) {
  const { data, error } = await supabaseClient
    .from("products")
    .update({
      Name: name,
      Price: price,
      Description: description,
      category: category
    })
    .eq("id", id)
    .select();

  if (error) {
    alert("Erreur de modification : " + error.message);
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    alert("Aucun produit modifié. Vérifions la règle RLS UPDATE dans Supabase.");
    return;
  }

  alert("Prix enregistré : " + data[0].Price + "$");
  await loadAdminProducts();
}

    .eq("id", id);

  if (error) {
    alert("Erreur de modification : " + error.message);
    console.error(error);
    return;
  }

  alert("Produit modifié avec succès !");
  await loadAdminProducts();
}



  /* =========================
     DÉCONNEXION
  ========================= */

  logoutButton.addEventListener(
    "click",
    async () => {

      await supabaseClient.auth.signOut();

      dashboard.style.display =
        "none";

      loginSection.style.display =
        "block";

    }
  );

</script>
 <script>

document.getElementById("addProductForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const status = document.getElementById("addProductMessage");
  const name = document.getElementById("productName").value.trim();
  const price = Number(document.getElementById("productPrice").value);
  const description = document.getElementById("productDescription").value.trim();
  const category = document.getElementById("productCategory").value.trim();
  const file = document.getElementById("productImage").files[0];

  if (!name || !file || !Number.isFinite(price) || price < 0) {
    status.textContent = "Remplis le nom, le prix et choisis une photo.";
    return;
  }

  status.textContent = "Enregistrement en cours...";

  try {
    const extension = file.name.split(".").pop().toLowerCase();
    const filePath = `${Date.now()}-${crypto.randomUUID()}.${extension}`;

    const { data: uploaded, error: uploadError } = await supabaseClient
      .storage
      .from("products")
      .upload(filePath, file, {
        contentType: file.type,
        upsert: false
      });

    if (uploadError) throw uploadError;

    const { data: publicData } = supabaseClient
      .storage
      .from("products")
      .getPublicUrl(uploaded.path);

    const { error: insertError } = await supabaseClient
      .from("products")
      .insert({
        Name: name,
        Price: price,
        Description: description,
        category: category,
        image_url: publicData.publicUrl
      });

    if (insertError) throw insertError;

    status.textContent = "Produit ajouté avec succès !";
    document.getElementById("addProductForm").reset();
    await loadAdminProducts();

  } catch (error) {
    console.error("Erreur ajout produit :", error);
    status.textContent = "Erreur : " + error.message;
  }
});


</script>
</body>
</html>
