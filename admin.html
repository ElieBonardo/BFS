<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BFS Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .admin {
      width: 100%;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    #loginSection,
    #dashboard {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .admin-product {
      padding: 15px;
      margin-top: 12px;
      background: #f5f5f5;
      border-radius: 10px;
    }

  </style>

</head>

<body>

<div class="admin">

  <!-- CONNEXION -->

  <div id="loginSection">

    <h1>🔐 BFS Admin</h1>

    <p>Connexion administrateur</p>

    <label for="email">
      E-mail
    </label>

    <input
      type="email"
      id="email"
      placeholder="Votre e-mail"
      autocomplete="email"
    >

    <label for="password">
      Mot de passe
    </label>

    <input
      type="password"
      id="password"
      placeholder="Votre mot de passe"
      autocomplete="current-password"
    >

    <button id="loginButton">
      Se connecter
    </button>

    <div id="message"></div>

  </div>


  <!-- TABLEAU DE BORD -->

  <div
    id="dashboard"
    style="display:none;"
  >

    <h1>🏪 BFS Admin</h1>

    <p style="text-align:center;">
      Gestion de Bonardo Fashion Store
    </p>

    <hr>

    <h2>Ajouter un produit</h2>

<form id="addProductForm">

  <label for="productName">Nom du produit</label>
  <input
    type="text"
    id="productName"
    required
  >

  <label for="productPrice">Prix en dollars</label>
  <input
    type="number"
    id="productPrice"
    min="0"
    step="0.01"
    required
  >

  <label for="productDescription">Description</label>
  <textarea
    id="productDescription"
    rows="3"
  ></textarea>

  <label for="productCategory">Catégorie</label>
  <input
    type="text"
    id="productCategory"
  >

  <label for="productImage">Photo du produit</label>
  <input
    type="file"
    id="productImage"
    accept="image/*"
    required
  >

  <button type="submit">
    Ajouter le produit
  </button>

  <p id="addProductMessage"></p>

</form>

<hr>

<h2>Gestion des produits</h2>

<div id="adminProducts">
  Chargement des produits...
</div>

    <button id="logoutButton">
      Se déconnecter
    </button>

  </div>

</div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://eulbdrwxyhdvosbmxnwy.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_LfwW5XWa2C_3WPArJvEsbQ_Klth7gNl";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     ELEMENTS
  ========================= */

  const loginButton =
    document.getElementById("loginButton");

  const logoutButton =
    document.getElementById("logoutButton");

  const message =
    document.getElementById("message");

  const loginSection =
    document.getElementById("loginSection");

  const dashboard =
    document.getElementById("dashboard");


  /* =========================
     CONNEXION
  ========================= */

  loginButton.addEventListener(
    "click",
    async () => {

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;


      if (!email || !password) {

        message.textContent =
          "Veuillez remplir les deux champs.";

        return;
      }


      message.textContent =
        "Connexion en cours...";


      const { data, error } =
        await supabaseClient.auth
          .signInWithPassword({
            email: email,
            password: password
          });


      if (error) {

        message.textContent =
          "Erreur : " + error.message;

        console.error(
          "ERREUR CONNEXION :",
          error
        );

        return;
      }


      console.log(
        "ADMIN CONNECTÉ :",
        data.user
      );


      loginSection.style.display =
        "none";

      dashboard.style.display =
        "block";

      message.textContent = "";


      await loadAdminProducts();

    }
  );


  /* =========================
     PRODUITS
  ========================= */

  async function loadAdminProducts() {

    const container =
      document.getElementById(
        "adminProducts"
      );


    container.innerHTML =
      "<p>Connexion à la base de données...</p>";


    const { data, error } =
      await supabaseClient
        .from("products")
        .select("*")
        .order(
          "id",
          { ascending: false }
        );


    console.log(
      "PRODUITS ADMIN :",
      data
    );


    if (error) {

      container.innerHTML = `
        <div style="
          background:#ffe5e5;
          color:#b00020;
          padding:15px;
          border-radius:10px;
        ">
          <strong>Erreur Supabase :</strong>
          <br><br>
          ${error.message}
        </div>
      `;

      console.error(
        "ERREUR SUPABASE :",
        error
      );

      return;
    }


    if (!data || data.length === 0) {

      container.innerHTML =
        "<p>Aucun produit disponible.</p>";

      return;
    }


    container.innerHTML = "";


    data.forEach(product => {

      const item =
        document.createElement("div");


      item.className =
        "admin-product";


      item.innerHTML = `
  ${
    product.image_url
      ? `<img
          src="${product.image_url}"
          alt="${product.Name || "Produit"}"
          style="
            width:100%;
            height:220px;
            object-fit:contain;
            background:#f5f5f5;
            border-radius:8px;
            margin-bottom:12px;
          "
        >`
      : `<p>📷 Image manquante</p>`
  }

  <strong>
    ${product.Name || ""}
  </strong>

  <br><br>

  Prix :
  ${product.Price ?? ""}$

  <br><br>

  Description :
  ${product.Description || ""}

  <br><br>

  Catégorie :
  ${product.category || ""}
`;


      container.appendChild(item);

    });

  }


  /* =========================
     DÉCONNEXION
  ========================= */

  logoutButton.addEventListener(
    "click",
    async () => {

      await supabaseClient.auth.signOut();

      dashboard.style.display =
        "none";

      loginSection.style.display =
        "block";

    }
  );

</script>

</body>

</html>
